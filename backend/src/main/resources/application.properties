spring.application.name=smart-parking-apartment

server.port=8080

# =========================================================
# PostgreSQL Database
# =========================================================

spring.datasource.driver-class-name=org.postgresql.Driver

# These values come from Render Environment Variables
spring.datasource.url=${SPRING_DATASOURCE_URL:}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# Keep database tables/data when backend restarts
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Run data.sql after Hibernate creates/updates the tables
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always


# =========================================================
# Smart Parking Behavior
# =========================================================

# How long a slot stays HELD before automatically
# returning to AVAILABLE
app.slot.hold-minutes=3


# =========================================================
# OTP
# =========================================================

# Real SMS OTP through Message Central
# Do not expose OTP codes in API responses
app.otp.expose-code=false

# Message Central VerifyNow
messagecentral.customer-id=${MESSAGECENTRAL_CUSTOMER_ID}
messagecentral.password-key=${MESSAGECENTRAL_PASSWORD_KEY}
messagecentral.email=${MESSAGECENTRAL_EMAIL:}

# =========================================================
# Admin
# =========================================================

# Simple fixed admin password for the project
app.admin.password=admin123

# =========================================================
# Razorpay
# =========================================================

razorpay.key.id=${RAZORPAY_KEY_ID}
razorpay.key.secret=${RAZORPAY_KEY_SECRET}