spring.application.name=smart-parking-apartment

server.port=8080

# --- In-memory H2 database (swap for MySQL/Postgres later) ---
spring.datasource.url=jdbc:h2:mem:parkingdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# create-drop = fresh schema from entities every restart, then reseed with data.sql
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.defer-datasource-initialization=true

spring.sql.init.mode=always

# --- Smart parking behavior ---
# How long a slot stays HELD before it's released back to AVAILABLE
# automatically (both lazily on read and via the scheduled sweeper).
app.slot.hold-minutes=3

# Echo the OTP code back in the API response while there is no real SMS
# provider wired in. Set to false once you plug in Twilio/MSG91/etc.
app.otp.expose-code=true

# --- Admin ---
# Simple fixed password for the admin panel (/admin in the frontend).
# Plaintext here is fine for this project's scope, but change this before
# any real deployment, and swap AdminAuthService for hashed-password +
# Spring Security/JWT if this ever needs to hold up for real.
app.admin.password=admin123