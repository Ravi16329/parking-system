spring.application.name=smart-parking-apartment

server.port=8080

# =========================================================
# PostgreSQL Database
# =========================================================

spring.datasource.driver-class-name=org.postgresql.Driver

# These values come from Render Environment Variables
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# Keep database tables/data when backend restarts
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Run data.sql after Hibernate creates/updates the tables
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always


# =========================================================
# Smart Parking Behavior
# =========================================================

# How long a slot stays HELD before automatically
# returning to AVAILABLE
app.slot.hold-minutes=3


# =========================================================
# OTP
# =========================================================

# Echo OTP code in API response while no real SMS
# provider is connected
app.otp.expose-code=true


# =========================================================
# Admin
# =========================================================

# Simple fixed admin password for the project
app.admin.password=admin123